
name: CI

on:
  push:
    branches: [main]

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
 
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/price-comparator:latest .

      - name: Push Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/price-comparator:latest
